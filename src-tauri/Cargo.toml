[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"


[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
toml = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-build = { version = "2.6", features = [] }
tauri-plugin-log = "2.7"                       # ← was "2" — pin a minor
libloading = "0.8"
keyring = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2.3.2"       # ← see note below
sha2 = "0.10"
hex = "0.4"
dirs = "6.0.0"
chrono = { version = "0.4.44", features = ["std", "serde"] }
rand = "0.8"
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
rfd = "0.15"
