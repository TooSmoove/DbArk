name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch/PR supersedes the running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on stale "devsql" naming in shipped source
        shell: bash
        run: |
          # Guards the completed DevSql -> DbArk rename (code audit C-2).
          # main.rs is excepted because it holds the TEMPORARY one-shot
          # migration shim (migrate_legacy_devsql), which must reference the
          # legacy "devsql:" / "~/.devsql" names. Remove --exclude=main.rs
          # below once that shim is deleted post-v1.0.
          matches=$(grep -rInI \
            --exclude-dir=node_modules --exclude-dir=target \
            --exclude-dir=obj --exclude-dir=bin \
            --exclude-dir=.git --exclude-dir=.vs \
            -e devsql \
            src src-tauri src-csharp index.html package.json || true)
          if [ -n "$matches" ]; then
            echo "::error::Stale 'devsql' naming found in shipped source — finish the DbArk rename:"
            echo "$matches"
            exit 1
          fi
          echo "OK: no stale devsql naming in shipped source (migration shim in main.rs excepted)."

      - name: No binaries or IDE cache in tree
        run: |
          if git ls-files | grep -Ei '\.(dll|dylib|so|pdb|zip|db)$|/\.vs/|/bin/|/obj/'; then
            echo "::error::Build artifact or IDE cache committed — see audit C-4"; exit 1
          fi

      - name: Fail on hardcoded DLL integrity hashes
        shell: bash
        run: |
          # Code audit C-3: DLL hashes must be generated by src-tauri/build.rs into
          # $OUT_DIR/dll_hashes.rs, never hand-edited as constants in source. A frozen
          # constant silently diverges from the CI-rebuilt NativeAOT libraries and makes
          # the shipped app fail its own startup integrity check.
          matches=$(grep -rInI \
            --include='*.rs' \
            --exclude-dir=target \
            -e 'const HASH_[A-Z]*:[[:space:]]*&str' \
            src-tauri/src || true)
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded DLL integrity hash constant found — these are generated by build.rs (code audit C-3):"
            echo "$matches"
            exit 1
          fi
          echo "OK: no hardcoded DLL integrity hashes (build.rs is the single source of truth)."

      - name: Fail on bare String/bool IPC commands
        shell: bash
        run: bash scripts/check-ipc-contract.sh

      - name: Fail on FFI signature drift
        shell: bash
        run: bash scripts/check-ffi-arity.sh

      - name: Fail if native binaries are committed
        shell: bash
        run: |
          hits=$(git ls-files | grep -iE '\.(dll|dylib|so)$|^sqlcipher\.zip$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Native binaries must not be committed — they are staged by scripts/stage-natives.* (code audit C-4):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no native binaries tracked in git."

  # ---------------------------------------------------------------------
  # Test & lint gates (code audit §6): builds are not allowed to go green
  # while the test suites and linters rot. Every job below is a required
  # check for the platform builds via `needs`.
  # ---------------------------------------------------------------------

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Lint (eslint — errors fail the build)
        run: npm run lint

      - name: Type-check + unit tests (tsc + vitest)
        run: npm test

      - name: Production type-check + bundle (tsc -b + vite)
        run: npm run build

  dotnet-tests:
    # windows-latest matches the primary target and the RID pinned in the
    # engine csproj files (win-x64); `dotnet test` builds IL only, so no
    # NativeAOT publish or native DLLs are needed here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run C# unit tests
        run: dotnet test src-csharp/QueryExecutor.Tests/QueryExecutorTests.Tests.csproj -c Release --nologo

  rust-fmt:
    # rustfmt parses source only — build.rs never runs, so no staged
    # natives are required and this stays a fast ubuntu job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

  build-windows:
    needs: [naming-guard, frontend-checks, dotnet-tests, rust-fmt]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri.exe
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Tauri CLI
        run: |
          if (-not (Get-Command cargo-tauri -ErrorAction SilentlyContinue)) {
            cargo install tauri-cli --version "^2.0" --locked
          }
        shell: pwsh

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend deps
        run: npm ci

      - name: Build C# NativeAOT projects
        run: |
          cd src-csharp/QueryExecutor    && dotnet publish -c Release -r win-x64 && cd ../..
          cd src-csharp/ConnectionManager && dotnet publish -c Release -r win-x64 && cd ../..
          cd src-csharp/FileQueryEngine   && dotnet publish -c Release -r win-x64 && cd ../..
          cd src-csharp/QueryHistory      && dotnet publish -c Release -r win-x64 && cd ../..
          cd src-csharp/SshTunnel         && dotnet publish -c Release -r win-x64 && cd ../..
          cd src-csharp/SchemaExplorer    && dotnet publish -c Release -r win-x64 && cd ../..

      - name: Copy native DLLs
        run: |
          copy src-csharp\QueryExecutor\bin\Release\net10.0\win-x64\publish\*.dll     src-tauri\natives\
          copy src-csharp\ConnectionManager\bin\Release\net10.0\win-x64\publish\*.dll src-tauri\natives\
          copy src-csharp\FileQueryEngine\bin\Release\net10.0\win-x64\publish\*.dll   src-tauri\natives\
          copy src-csharp\QueryHistory\bin\Release\net10.0\win-x64\publish\*.dll      src-tauri\natives\
          copy src-csharp\SshTunnel\bin\Release\net10.0\win-x64\publish\*.dll         src-tauri\natives\
          copy src-csharp\SchemaExplorer\bin\Release\net10.0\win-x64\publish\*.dll    src-tauri\natives\

      - name: Check Tauri version alignment
        run: cargo tauri info

      - name: Stage third-party natives (DuckDB + SQLCipher)
        shell: pwsh
        run: ./scripts/stage-natives.ps1

      # clippy/test must run AFTER natives are staged: build.rs fails loudly
      # when natives/ is incomplete (that failure mode is by design — see
      # AGENTS.md on the integrity check).
      - name: cargo clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app
        run: cargo tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: placeholder
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: placeholder

  build-macos:
    needs: [naming-guard, frontend-checks, dotnet-tests, rust-fmt]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-tauri
            src-tauri/target
          key: macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2.0" --locked
          fi

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        run: npm ci

      - name: Build C# NativeAOT projects
        run: |
          cd src-csharp/QueryExecutor    && dotnet publish -c Release -r osx-arm64 && cd ../..
          cd src-csharp/ConnectionManager && dotnet publish -c Release -r osx-arm64 && cd ../..
          cd src-csharp/FileQueryEngine   && dotnet publish -c Release -r osx-arm64 && cd ../..
          cd src-csharp/QueryHistory      && dotnet publish -c Release -r osx-arm64 && cd ../..
          cd src-csharp/SshTunnel         && dotnet publish -c Release -r osx-arm64 && cd ../..
          cd src-csharp/SchemaExplorer    && dotnet publish -c Release -r osx-arm64 && cd ../..

      - name: Copy native dylibs
        run: |
          cp src-csharp/QueryExecutor/bin/Release/net10.0/osx-arm64/publish/*.dylib     src-tauri/natives/
          cp src-csharp/ConnectionManager/bin/Release/net10.0/osx-arm64/publish/*.dylib src-tauri/natives/
          cp src-csharp/FileQueryEngine/bin/Release/net10.0/osx-arm64/publish/*.dylib   src-tauri/natives/
          cp src-csharp/QueryHistory/bin/Release/net10.0/osx-arm64/publish/*.dylib      src-tauri/natives/
          cp src-csharp/SshTunnel/bin/Release/net10.0/osx-arm64/publish/*.dylib         src-tauri/natives/
          cp src-csharp/SchemaExplorer/bin/Release/net10.0/osx-arm64/publish/*.dylib    src-tauri/natives/

      - name: Stage third-party natives (DuckDB + SQLCipher)
        run: bash scripts/stage-natives.sh

      # Runs the same #[cfg(test)] suites as Windows — catches the
      # OS-conditional paths (dylib resolution, path handling) the audit
      # flagged as unproven off-Windows.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build Tauri app
        run: cargo tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: placeholder
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: placeholder
